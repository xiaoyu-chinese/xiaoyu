<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Học tiếng Trung cùng XiaoYu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Serif:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#e9f5fb; --bg2:#d4ecf7; --surface:#ffffff; --ink:#123a4d; --muted:#5f8498;
  --brand:#2f9fd6; --brand-d:#1d87c0; --sky:#cbeafa; --sky2:#eaf7fe;
  --jade:#2bb38a; --coral:#ff7a52; --sun:#ffc24b;
  --good:#23b386; --warn:#f0a500; --bad:#e2574c;
  --line:#d6e9f3; --shadow:0 10px 30px rgba(29,135,192,.16); --shadow-sm:0 4px 14px rgba(29,135,192,.12);
  --r:20px; --r-sm:14px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Nunito,system-ui,Arial,sans-serif;color:var(--ink);min-height:100%;
  background:
    linear-gradient(180deg, rgba(255,255,255,.32), rgba(255,255,255,0) 34%),
    url('sky.jpg') center top/cover no-repeat fixed,
    #d4ecf7}
h1,h2,h3{font-family:'Baloo 2',Nunito,sans-serif;margin:0;line-height:1.14;text-wrap:balance}
img{max-width:100%}
a{color:var(--brand-d)}
[hidden]{display:none!important}
.wrap{max-width:900px;margin:0 auto;padding-block:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:rgba(255,255,255,.62);backdrop-filter:blur(20px) saturate(1.25);-webkit-backdrop-filter:blur(20px) saturate(1.25);
  border:1px solid rgba(255,255,255,.72);border-radius:var(--r);box-shadow:0 20px 50px rgba(63,118,158,.22);padding:22px}
.card+.card{margin-top:14px}
.soft{background:var(--sky2);border:1px solid var(--line);border-radius:var(--r-sm)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
label{font-weight:700;font-size:.88rem;color:var(--muted);display:block;margin:0 0 6px}
.field{position:relative;margin-bottom:12px}
.field .ic{position:absolute;left:14px;top:38px;font-size:1.05rem;opacity:.7}
input,select,textarea{width:100%;font:inherit;padding:12px 14px;border:1.6px solid var(--line);
  border-radius:12px;background:#f6fbfe;color:var(--ink)}
.field.ico input{padding-left:42px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--sky)}
.btn{font:inherit;font-weight:800;cursor:pointer;border:none;border-radius:999px;padding:13px 24px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:linear-gradient(135deg,#43b2e6,var(--brand-d));color:#fff;box-shadow:0 6px 16px rgba(29,135,192,.32)}
.btn:hover{filter:brightness(1.04)} .btn:active{transform:translateY(1px)}
.btn.block{width:100%}
.btn.ghost{background:#eef7fc;color:var(--brand-d);box-shadow:none;border:1.6px solid var(--sky)}
.btn.sm{padding:9px 16px;font-size:.9rem}
.btn.good{background:var(--good)} .btn.warn{background:var(--warn)} .btn.bad{background:var(--bad)}
.btn.coral{background:linear-gradient(135deg,#ff9b6b,var(--coral))}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--sky);color:var(--brand-d);
  font-weight:800;font-size:.78rem;padding:5px 12px;border-radius:999px}
.pill.coral{background:#ffe6db;color:#d4572f}
.pill.jade{background:#d6f5ea;color:#17936b}
.pill.grey{background:#eaf1f5;color:#6f8ea0}
.muted{color:var(--muted)} .center{text-align:center}
.big{font-size:2.2rem;font-weight:800;font-family:'Baloo 2'}
.hz{font-family:'Baloo 2';font-size:2.9rem;letter-spacing:3px;color:var(--ink)}

/* ---- thương hiệu ---- */
.brand{display:inline-flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 6px 16px rgba(29,135,192,.3);flex:none}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand b{font-family:'Baloo 2';font-size:1.15rem}
.brand small{display:block;color:var(--muted);font-weight:700;font-size:.72rem;letter-spacing:.03em;margin-top:-2px}

/* ===== BANNER CỐ ĐỊNH ===== */
.banner{position:sticky;top:0;z-index:40;
  background:linear-gradient(135deg, rgba(255,255,255,.78), rgba(203,234,250,.72));
  backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  border-bottom:1px solid rgba(255,255,255,.75);box-shadow:0 6px 22px rgba(29,135,192,.14)}
.banner-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:14px;
  padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px))}
.b-logo{width:56px;height:56px;border-radius:50%;overflow:hidden;flex:none;background:#fff;
  box-shadow:0 6px 16px rgba(29,135,192,.3);border:3px solid rgba(255,255,255,.9)}
.b-logo img{width:100%;height:100%;object-fit:cover;display:block}
.b-main{flex:1;min-width:0}
.b-title{font-family:'Baloo 2';font-weight:800;font-size:1.5rem;line-height:1.05;
  background:linear-gradient(95deg,#ff6a3d,#ff9a3d 55%,#ffb13d);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 1px 0 rgba(255,255,255,.4)}
.b-sub{color:#1d6a90;font-weight:700;font-size:.82rem;margin-top:2px;line-height:1.3}
.b-zalo{flex:none;text-decoration:none;font-weight:800;font-size:.84rem;color:#fff;
  background:linear-gradient(135deg,#34c759,#1aa34a);padding:9px 15px;border-radius:999px;
  box-shadow:0 5px 14px rgba(26,163,74,.32);white-space:nowrap}
@media(max-width:720px){
  .b-title{font-size:1.18rem}
  .b-sub{font-size:.72rem}
  .b-zalo{padding:8px 11px;font-size:.76rem}
  .b-logo{width:46px;height:46px}
}
@media(max-width:480px){
  .banner-in{flex-wrap:wrap}
  .b-zalo{order:3;width:100%;text-align:center;margin-top:2px}
}

/* ===== SHELL: sidebar + nội dung ===== */
.shell{max-width:1040px;margin:0 auto;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:224px 1fr;gap:16px;align-items:start}
.sidebar{display:flex;flex-direction:column;gap:6px;
  background:rgba(255,255,255,.58);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.72);border-radius:var(--r);padding:12px;box-shadow:var(--shadow-sm)}
.navbtn{display:flex;align-items:center;gap:10px;border:none;background:transparent;font:inherit;font-weight:800;
  color:var(--ink);padding:11px 13px;border-radius:12px;cursor:pointer;text-align:left;width:100%}
.navbtn .ni{font-size:1.15rem;width:22px;text-align:center}
.navbtn:hover{background:#eaf6fd}
.navbtn.on{background:linear-gradient(135deg,#43b2e6,var(--brand-d));color:#fff;box-shadow:0 5px 13px rgba(29,135,192,.3)}
.navbtn.out{color:var(--muted);font-weight:700;margin-top:4px}
.content{min-width:0}
@media(max-width:860px){
  .shell{grid-template-columns:1fr;gap:12px}
  .sidebar{flex-direction:row;overflow-x:auto;padding:8px;gap:4px}
  .navbtn{flex-direction:column;gap:3px;padding:8px 10px;font-size:.72rem;min-width:66px}
  .navbtn .ni{font-size:1.25rem;width:auto}
  .navbtn.out{margin-top:0}
  .navbtn .nlabel{white-space:nowrap}
}

.grid{display:grid;gap:12px}
.cols3{grid-template-columns:repeat(3,1fr)}
.cols2{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--sky2);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 10px;text-align:center}
.stat b{display:block;font-size:1.55rem;font-family:'Baloo 2';color:var(--brand-d)}
.stat span{font-size:.74rem;color:var(--muted);font-weight:800;letter-spacing:.03em}
.seg{display:flex;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);border-radius:999px;padding:5px;gap:4px;box-shadow:var(--shadow-sm)}
.seg button{flex:1;border:none;background:transparent;font:inherit;font-weight:800;color:var(--muted);
  padding:10px;border-radius:999px;cursor:pointer}
.seg button.on{background:#fff;color:var(--brand-d);box-shadow:var(--shadow-sm)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;box-shadow:var(--shadow);z-index:60;max-width:92vw;text-align:center}
.flash{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  text-align:center;padding:22px;border:2px dashed var(--sky);border-radius:18px;background:var(--sky2);cursor:pointer}
.progressbar{height:10px;background:var(--sky);border-radius:999px;overflow:hidden}
.progressbar>i{display:block;height:100%;background:linear-gradient(90deg,#5bc0ea,var(--brand));width:0;transition:width .2s}
.listbtn{display:block;width:100%;text-align:left;border:1.6px solid var(--line);background:#fff;border-radius:var(--r-sm);
  padding:14px 16px;cursor:pointer;font:inherit;box-shadow:var(--shadow-sm)}
.listbtn:hover{border-color:var(--brand)}
.pagehead{text-align:center;padding:12px 0 2px}
.pagehead h1{font-size:1.95rem;color:var(--ink);text-shadow:0 1px 12px rgba(255,255,255,.7)}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 18px}
.chip{background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:var(--brand-d);font-weight:800;font-size:.78rem;padding:7px 14px;border-radius:999px;box-shadow:var(--shadow-sm)}
.logincard{max-width:430px;margin:0 auto;text-align:center}
.avatar{width:92px;height:92px;border-radius:50%;margin:0 auto 10px;overflow:hidden;
  box-shadow:0 10px 26px rgba(29,135,192,.38);border:4px solid rgba(255,255,255,.85);background:#fff}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.logincard .lname{font-family:'Baloo 2';font-size:1.2rem;display:block}
.logincard .motto{color:var(--muted);margin:8px 0 16px}
.hero{position:relative;overflow:hidden;border-radius:var(--r);color:var(--ink);padding:22px 22px;
  background:linear-gradient(135deg,rgba(255,255,255,.58),rgba(201,234,250,.42));border:1px solid rgba(255,255,255,.7)}
.hero p{color:var(--muted)}
.hero .mark{width:54px;height:54px;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 8px 18px rgba(29,135,192,.32);border:3px solid rgba(255,255,255,.85)}
.mark img{width:100%;height:100%;object-fit:cover;display:block}
footer{color:var(--muted);font-size:.8rem;text-align:center;padding:18px}
.linklike{background:none;border:none;color:var(--brand-d);font:inherit;font-weight:700;cursor:pointer;padding:0;text-decoration:underline}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em}
.tbl-wrap{overflow-x:auto}
.weak{color:var(--bad);font-weight:800}

/* list từ vựng */
.vrow{background:#fff;border:1.4px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;box-shadow:var(--shadow-sm)}
.vrow+.vrow{margin-top:10px}
.vrow .vtop{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.vrow .vh{font-family:'Baloo 2';font-size:1.7rem;letter-spacing:1px}
.vrow .vp{font-weight:800;color:var(--brand-d)}
.vrow .vpos{font-size:.72rem;font-weight:800;color:#8a6d00;background:#fff2cf;padding:2px 8px;border-radius:999px}
.vrow .vvi{font-size:1.02rem;margin-top:2px}
.vrow .vex{color:var(--muted);font-size:.9rem;margin-top:6px}
.vrow .vex b{color:var(--ink);font-weight:800}
.mbar{display:inline-flex;gap:3px;vertical-align:middle}
.mbar i{width:9px;height:9px;border-radius:50%;background:#dbe8f0;display:inline-block}
.mbar i.f1,.mbar i.f2{background:var(--coral)} .mbar i.f3,.mbar i.f4{background:var(--brand)} .mbar i.f5{background:var(--jade)}
.gamecard{border:1.6px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:16px;text-align:center;cursor:pointer;box-shadow:var(--shadow-sm)}
.gamecard:hover{border-color:var(--brand);transform:translateY(-2px)}
.gamecard .gi{font-size:2rem}
.gamecard b{display:block;margin-top:6px;font-family:'Baloo 2';font-size:1.05rem}
.gamecard small{color:var(--muted);font-weight:700}
.opt{display:block;width:100%;text-align:left;border:1.6px solid var(--line);background:#fff;border-radius:12px;
  padding:13px 16px;font:inherit;font-weight:700;cursor:pointer;margin-top:9px}
.opt:hover{border-color:var(--brand)}
.opt.ok{border-color:var(--good);background:#e4f8f1;color:#12795a}
.opt.no{border-color:var(--bad);background:#fdecea;color:#b43527}
.ansbox{font-size:1.25rem;text-align:center;letter-spacing:1px}
.rankrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;background:#fff;border:1.4px solid var(--line);box-shadow:var(--shadow-sm)}
.rankrow+.rankrow{margin-top:8px}
.rankrow.me{border-color:var(--brand);background:#eef8fe}
.rankno{font-family:'Baloo 2';font-size:1.2rem;width:30px;text-align:center;color:var(--brand-d)}

/* ===================== TRANG CHỦ (LANDING) ===================== */
.lp-wrap{max-width:1180px;margin:0 auto;padding-inline:max(18px,env(safe-area-inset-left,0px))}
.lp-nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.80);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.7)}
.lp-nav-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:9px max(18px,env(safe-area-inset-left,0px))}
.lp-brand{display:flex;align-items:center;gap:10px;flex:none}
.lp-brand .logo{width:46px;height:46px}
.lp-brand b{font-family:'Noto Serif',serif;font-size:1.12rem;color:#0f3b63;display:block;line-height:1.05}
.lp-brand small{color:var(--muted);font-weight:700;font-size:.66rem}
.lp-links{display:flex;gap:2px;flex:1;justify-content:center;flex-wrap:wrap}
.lp-links a{font-weight:700;font-size:.85rem;color:#2d5a72;padding:8px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.lp-links a:hover{background:#eaf6fd;color:var(--brand-d)}
.lp-links a.on{color:var(--brand-d)}
.lp-reg{flex:none;text-decoration:none;font-weight:800;font-size:.85rem;color:#fff;background:linear-gradient(135deg,#2f6fd6,#1d4f9c);padding:10px 16px;border-radius:999px;box-shadow:0 6px 16px rgba(29,79,156,.3)}
@media(max-width:1040px){ .lp-links{display:none} }
.lp-hero{position:relative;overflow:hidden;background:linear-gradient(118deg,rgba(233,245,251,.82),rgba(203,234,250,.3)),url('sky.jpg') center/cover no-repeat}
.lp-hero-in{max-width:1180px;margin:0 auto;padding:54px max(18px,env(safe-area-inset-left,0px)) 60px;min-height:290px}
.lp-hero-txt{max-width:620px}
.lp-hero h1{font-family:'Noto Serif',serif;font-size:3rem;color:#123a5e;line-height:1.08}
.lp-xy{color:#1d4f9c}
.lp-tag{font-style:italic;color:#2d6a8c;font-weight:700;font-size:1.08rem;margin:14px 0 20px;display:inline-block;border-bottom:3px solid rgba(47,159,214,.4);padding-bottom:6px}
@media(max-width:640px){ .lp-hero h1{font-size:2.05rem} }
.lp-sec{padding:30px 0}
.lp-sec h2{font-family:'Baloo 2';font-size:1.4rem;color:#123a5e;margin-bottom:16px}
.lp-courses{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
@media(max-width:980px){ .lp-courses{grid-template-columns:repeat(2,1fr)} }
@media(max-width:520px){ .lp-courses{grid-template-columns:1fr} }
.lp-course{position:relative;overflow:hidden;text-align:left;cursor:pointer;border:1px solid rgba(255,255,255,.85);background:linear-gradient(160deg,#ffffff,#eef7fe);border-radius:18px;padding:18px 16px 20px;box-shadow:var(--shadow-sm);transition:transform .25s,opacity .25s,box-shadow .25s;font:inherit}
.lp-courses:hover .lp-course{opacity:.62;transform:scale(.96)}
.lp-courses .lp-course:hover{opacity:1;transform:scale(1.07);z-index:3;box-shadow:0 18px 42px rgba(29,135,192,.3)}
.lp-clv{font-family:'Baloo 2';font-size:1.95rem;font-weight:800;color:var(--cc)}
.lp-csub{font-weight:700;color:#355d73;margin:4px 0 16px;min-height:40px;font-size:.92rem}
.lp-clink{font-weight:800;font-size:.82rem;color:var(--cc)}
.lp-course.soon .lp-clink{color:var(--muted)}
.lp-cmark{position:absolute;right:10px;bottom:10px;font-size:2.1rem;opacity:.45}
.lp-course.soon{filter:saturate(.55)}
.lp-feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:4px 0 2px}
@media(max-width:820px){ .lp-feat-grid{grid-template-columns:repeat(2,1fr)} }
.lp-f{display:flex;gap:10px;align-items:flex-start;color:#355d73;font-weight:700;font-size:.9rem}
.lp-f .fi{font-size:1.5rem;flex:none}
.lp-info{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
@media(max-width:980px){ .lp-info{grid-template-columns:repeat(2,1fr)} }
@media(max-width:520px){ .lp-info{grid-template-columns:1fr} }
.lp-ic{background:rgba(255,255,255,.74);border:1px solid rgba(255,255,255,.85);border-radius:16px;padding:16px;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .25s,opacity .25s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lp-info:hover .lp-ic{opacity:.66;transform:scale(.97)}
.lp-info .lp-ic:hover{opacity:1;transform:scale(1.05);z-index:3}
.lp-ic .ii{font-size:1.5rem}
.lp-ic b{display:block;margin:8px 0 6px;color:#123a5e}
.lp-ic small{color:var(--muted);font-weight:600;font-size:.82rem;line-height:1.4}
.lp-ic .more{display:inline-block;margin-top:10px;color:var(--brand-d);font-weight:800;font-size:.8rem}
.lp-cta{margin:22px 0 12px;padding:22px 0;background:linear-gradient(120deg,rgba(203,234,250,.62),rgba(233,245,251,.42));border-top:1px solid rgba(255,255,255,.7);border-bottom:1px solid rgba(255,255,255,.7)}
.lp-cta b{font-family:'Baloo 2';font-size:1.3rem;color:#123a5e}
.lp-cta .btn{text-decoration:none}
.lp-zalo{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#2aa4ff,#0b74d4);color:#fff;font-weight:800;font-size:.74rem;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(11,116,212,.42);text-decoration:none}
.coursebadge{display:inline-flex;align-items:center;gap:8px;background:var(--sky);color:var(--brand-d);font-weight:800;padding:6px 14px;border-radius:999px;font-family:'Baloo 2'}
</style>
</head>
<body>
<div id="root"><div class="wrap"><div class="card center"><div class="big">🌊</div><p class="muted">Đang tải…</p></div></div></div>
<footer>Học tiếng Trung cùng <b>XiaoYu</b> · Dạy kỹ – Học kỹ – Tiến bộ mỗi ngày</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="vocab.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAeeTVhAnTds9pPxCPcgNWAbc4zAiVsP3I",
  authDomain: "xiaoyu-chinese.firebaseapp.com",
  projectId: "xiaoyu-chinese",
  storageBucket: "xiaoyu-chinese.firebasestorage.app",
  messagingSenderId: "333044970276",
  appId: "1:333044970276:web:356bb1af3eda4649eb79b1"
};
let db=null, FB_OK=false;
try{ if(firebaseConfig.apiKey && firebaseConfig.apiKey!=="DAN_VAO_DAY"){
  firebase.initializeApp(firebaseConfig); db=firebase.firestore(); FB_OK=true; } }catch(e){ console.warn(e); }

/* ---- tiện ích ---- */
const root=document.getElementById('root');
const $=s=>document.querySelector(s);
const todayKey=()=> new Date().toISOString().slice(0,10);

/* ---- lịch lặp lại ngắt quãng (SM-2 rút gọn) + mức thành thạo chung ---- */
function schedule(card,grade){
  card.reps=card.reps||0; card.ease=card.ease||2.3; card.interval=card.interval||0;
  card.seen=(card.seen||0)+1;
  if(grade===0){ card.reps=0; card.interval=1; card.ease=Math.max(1.6,card.ease-0.2); card.wrong=(card.wrong||0)+1;
    card.mastery=Math.max(0,(card.mastery||0)-1); }
  else{ card.correct=(card.correct||0)+1; card.reps++;
    if(grade===1){ card.ease=Math.max(1.7,card.ease-0.1); }
    else { card.mastery=Math.min(5,(card.mastery||0)+1); }
    if(card.reps===1) card.interval=1; else if(card.reps===2) card.interval=3;
    else card.interval=Math.round(card.interval*card.ease);
    if(grade===1) card.interval=Math.max(1,Math.round(card.interval*0.6)); }
  const d=new Date(); d.setDate(d.getDate()+card.interval); card.due=d.toISOString().slice(0,10);
  return card;
}
const isDue=card=> card && (!card.due || card.due<=todayKey());
const masteryOf=wid=>{const c=CARDS[wid];return c?(c.mastery||0):0;};
function mbar(lv){let h='<span class="mbar">';for(let i=1;i<=5;i++)h+=`<i class="${i<=lv?'f'+lv:''}"></i>`;return h+'</span>';}

/* ---- chuẩn hoá để tự chấm ---- */
function normPinyin(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ü/g,'u').replace(/[^a-z]/g,'');}
function normHan(s){return (s||'').replace(/\s+/g,'').replace(/[，。！？、,.!?]/g,'');}

async function loadMe(){ ME=(await stuRef(STATE.code,STATE.sid).get()).data();
  const tk=todayKey();
  if(ME.lastDay!==tk){ const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    ME.streak=(ME.lastDay===y)?(ME.streak||0)+1:1; ME.lastDay=tk; ME.days=ME.days||[]; if(!ME.days.includes(tk))ME.days.push(tk);
    ME._newday=true; await stuRef(STATE.code,STATE.sid).update({streak:ME.streak,lastDay:tk,days:ME.days}); }
}
async function loadCards(){ const snap=await cardsCol(STATE.code,STATE.sid).get(); CARDS={}; snap.docs.forEach(d=>CARDS[d.id]=d.data()); }

  root.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{LIST_SORT=b.dataset.s;root.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b));drawList();});

function drawList(){
  const box=$('#vlist'); if(!box)return;
  const q=LIST_Q.trim().toLowerCase(), qn=normPinyin(q);
  let ws=ALLWORDS.filter(w=> !q || w.hanzi.includes(q) || normPinyin(w.pinyin).includes(qn) || (w.vi||'').toLowerCase().includes(q));
  if(LIST_SORT==='abc') ws=[...ws].sort((a,b)=>normPinyin(a.pinyin)<normPinyin(b.pinyin)?-1:1);
  if(!ws.length){box.innerHTML=`<div class="card center muted">Không tìm thấy từ nào 🤔</div>`;return;}
  let cur=null, html='';
  ws.forEach(w=>{
    if(LIST_SORT==='lesson' && w.lessonId!==cur){cur=w.lessonId; html+=`<h3 style="margin:18px 4px 8px;color:var(--ink);text-shadow:0 1px 10px rgba(255,255,255,.7)">${esc(w.lessonTitle)}</h3>`;}

    html+=`<div class="vrow">

      <div class="vex">${exHi}<br><span style="opacity:.85">${esc(w.exVi)}</span></div>

  });
  box.innerHTML=html;
}

function reviewPickGame(scope,lid){ // vào thẳng từ nút bài ở trang chính
  startGame('flash',scope,lid);
}

function buildQueue(scope,lid){
  let words=[];
  if(scope==='due') words=dueList();
  else if(scope==='lesson'){ const l=LESSONS.find(x=>x.id===lid); words=l?l.words.map(w=>WORDMAP[w.id]):[]; }
  else words=ALLWORDS.slice();
  // xáo trộn
  for(let i=words.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[words[i],words[j]]=[words[j],words[i]];}
  return words.map(w=>({w, card: CARDS[w.id]||{wid:w.id,lessonId:w.lessonId,reps:0,ease:2.3,interval:0,due:'',correct:0,wrong:0,seen:0,mastery:0}}));
}
const GAME_NAMES={flash:'Thẻ lật',pinyin:'Gõ pinyin',hanzi:'Gõ chữ Hán',mean:'Chọn nghĩa'};

function startGame(game,scope,lid){
  const queue=buildQueue(scope,lid);
  if(!queue.length) return toast('Không có từ trong phạm vi này');
  const session={startedAt:now(),game,reviewed:0,correct:0,wrong:0,scope:(scope==='lesson'?lid:scope)};
  let i=0, tStart=0;
  function frame(inner){
    shell(`<div class="card">
      <div class="spread"><span class="pill">${GAME_NAMES[game]} · ${i+1}/${queue.length}</span><button class="linklike" id="x">Thoát</button></div>
      <div class="progressbar" style="margin:12px 0"><i style="width:${Math.round(i/queue.length*100)}%"></i></div>
      ${inner}</div>`);
    $('#x').onclick=()=>finish(true);
  }
  async function grade(item,g){
    const ms=Date.now()-tStart; item.card.timeMs=(item.card.timeMs||0)+ms;
    schedule(item.card,g); session.reviewed++; g===0?session.wrong++:session.correct++;
    item.card.wid=item.w.id; item.card.lessonId=item.w.lessonId;
    await saveCard(item.card); i++; step();
  }
  function step(){
    if(i>=queue.length) return finish(false);
    const item=queue[i], w=item.w; tStart=Date.now();
    if(game==='flash') return flashCard(item);
    if(game==='pinyin') return typeCard(item,'pinyin');
    if(game==='hanzi') return typeCard(item,'hanzi');
    if(game==='mean') return meanCard(item);
  }
  function flashCard(item){const w=item.w;
    frame(`<div class="flash" id="fc"><div class="hz">${esc(w.hanzi)}</div><p class="muted" id="hint">Chạm để xem đáp án 👆</p></div>
      <div id="ans" hidden class="center" style="margin-top:14px">
        <div style="font-size:1.25rem;font-weight:800;color:var(--brand-d)">${esc(w.pinyin)} <span class="vpos">${esc(w.pos)}</span></div>
        <div style="font-size:1.2rem;margin:4px 0">${esc(w.vi)}</div>
        <div class="muted" style="margin-top:6px">${esc(w.ex)}<br>${esc(w.exVi)}</div>
        <div class="row" style="justify-content:center;margin-top:18px">
          <button class="btn bad" data-g="0">Quên</button><button class="btn warn" data-g="1">Mơ hồ</button><button class="btn good" data-g="2">Nhớ</button></div>
      </div>`);
    $('#fc').onclick=()=>{const h=$('#hint');if(h)h.remove();$('#ans').hidden=false;};
    root.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>grade(item,+b.dataset.g));
  }
  function typeCard(item,kind){const w=item.w;
    const prompt = kind==='pinyin'
      ? `<div class="hz">${esc(w.hanzi)}</div><p class="muted">Gõ pinyin (có hoặc không dấu đều được)</p>`
      : `<div style="font-size:1.4rem;font-weight:800">${esc(w.vi)}</div><p class="muted">${esc(w.pinyin)} — gõ chữ Hán 汉字</p>`;
    frame(`<div class="center" style="padding:10px 0 4px">${prompt}</div>
      <input id="in" class="ansbox" autocomplete="off" autocapitalize="off" placeholder="${kind==='pinyin'?'vd: fuxi':'gõ 汉字'}" style="margin-top:12px">
      <button class="btn block" id="ck" style="margin-top:12px">Kiểm tra</button>
      <div id="fb" style="margin-top:12px"></div>`);
    const inp=$('#in'); inp.focus();
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
    $('#ck').onclick=check;
    function check(){
      const val=inp.value.trim(); if(!val)return;
      const ok = kind==='pinyin' ? normPinyin(val)===normPinyin(w.pinyin) : normHan(val)===normHan(w.hanzi);
      inp.disabled=true;$('#ck').disabled=true;
      $('#fb').innerHTML=`<div class="${ok?'opt ok':'opt no'}">${ok?'✅ Chính xác!':'❌ Chưa đúng'} &nbsp; <b style="font-family:Baloo 2,sans-serif;font-size:1.15rem">${esc(w.hanzi)}</b> · ${esc(w.pinyin)} · ${esc(w.vi)}</div>
        <button class="btn block ${ok?'good':'coral'}" id="nx" style="margin-top:10px">Tiếp →</button>`;
      $('#nx').onclick=()=>grade(item, ok?2:0);
    }
  }
  function meanCard(item){const w=item.w;
    const others=ALLWORDS.filter(x=>x.id!==w.id).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.vi);
    const opts=[w.vi,...others].sort(()=>Math.random()-0.5);
    frame(`<div class="center" style="padding:8px 0"><div class="hz">${esc(w.hanzi)}</div><p class="muted">${esc(w.pinyin)} — chọn nghĩa đúng</p></div>
      <div id="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`);
    root.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=b.dataset.v===w.vi;
      root.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(x.dataset.v===w.vi)x.classList.add('ok'); else if(x===b)x.classList.add('no');});
      setTimeout(()=>grade(item, ok?2:0), ok?650:1300);
    });
  }
  async function finish(early){
    session.endedAt=now(); session.dur=Math.round((session.endedAt-session.startedAt)/1000); session.week=weekOf(new Date());
    if(session.reviewed) await sessCol(STATE.code,STATE.sid).add(session);
    if(early && !session.reviewed){ pageReview(); return; }
    const acc=session.reviewed?Math.round(session.correct/session.reviewed*100):0;
    shell(`<div class="card center"><div class="big">${acc>=80?'🎉':'💪'}</div><h2>${early?'Tạm dừng':'Hoàn thành'}!</h2>
      <p class="muted">${GAME_NAMES[game]}</p>
      <div class="grid cols3" style="margin-top:14px"><div class="stat"><b>${session.reviewed}</b><span>TỪ</span></div><div class="stat"><b>${acc}%</b><span>ĐÚNG</span></div><div class="stat"><b>${fmtDur(session.dur)}</b><span>THỜI GIAN</span></div></div>
      <button class="btn block" id="again" style="margin-top:16px">🎮 Ôn tiếp</button>
      <button class="btn block ghost" id="home" style="margin-top:10px">🏠 Về trang chính</button></div>`);
    $('#again').onclick=()=>pageReview();
    $('#home').onclick=()=>go('home');
  }
  step();
}

async function pageStats(){
  shell(`<div class="card center muted">Đang tổng hợp…</div>`);
  const sess=(await sessCol(STATE.code,STATE.sid).get()).docs.map(d=>d.data());
  const cards=Object.values(CARDS);

  const rev=sess.reduce((n,s)=>n+(s.reviewed||0),0), corr=sess.reduce((n,s)=>n+(s.correct||0),0);
  const acc=rev?Math.round(corr/rev*100):0;
  const mastered=ALLWORDS.filter(w=>masteryOf(w.id)>=5).length;
  const learned=cards.length;
  const weak=cards.filter(c=>(c.wrong||0)>(c.correct||0)).map(c=>WORDMAP[c.wid]).filter(Boolean);

  if(weak.length){ $('#fixweak').onclick=()=>{ // ôn riêng nhóm yếu bằng thẻ lật

function startGameFromWords(game,words){
  // tạm thời dùng chọn nghĩa/flash trên danh sách tuỳ ý
  const ids=new Set(words.map(w=>w.id));
  const saved=ALLWORDS.slice();
  // dùng buildQueue 'all' rồi lọc — đơn giản: gọi startGame với scope all nhưng lọc
  const queue=words.map(w=>({w,card:CARDS[w.id]||{wid:w.id,lessonId:w.lessonId,reps:0,ease:2.3,interval:0,due:'',correct:0,wrong:0,seen:0,mastery:0}}));
  // tái dùng startGame bằng cách tạm thay thế: đơn giản hoá -> gọi startGame trên 1 "ảo"
  _customQueue=queue; startGame(game,'_custom',null);
}
let _customQueue=null;
// mở rộng buildQueue cho scope _custom
const _origBuildQueue=buildQueue;
buildQueue=function(scope,lid){ if(scope==='_custom'&&_customQueue){const q=_customQueue;_customQueue=null;return q;} return _origBuildQueue(scope,lid); };

async function pageRank(){
  shell(`<div class="card center muted">Đang xếp hạng…</div>`);
  const stus=await stuCol(STATE.code).get();
  const rows=[];
  for(const s of stus.docs){ const d=s.data();
    const cards=(await cardsCol(STATE.code,s.id).get()).docs.map(x=>x.data());
    const pts=cards.reduce((n,c)=>n+(c.mastery||0),0);
    const mastered=cards.filter(c=>(c.mastery||0)>=5).length;
    rows.push({id:s.id,name:d.name,streak:d.streak||0,learned:cards.length,mastered,pts});
  }
  rows.sort((a,b)=> b.pts-a.pts || b.mastered-a.mastered || b.streak-a.streak);
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
  shell(`<div class="card">

function weekOf(d){const o=new Date(d);const day=(o.getDay()+6)%7;o.setDate(o.getDate()-day);return o.toISOString().slice(0,10);}
function fmtDur(s){s=s||0;const h=Math.floor(s/3600),m=Math.floor(s%3600/60);if(h)return `${h}h${String(m).padStart(2,'0')}`;return m?`${m}p${String(s%60).padStart(2,'0')}`:`${s}s`;}

    const weak=cards.filter(c=>(c.wrong||0)>(c.correct||0)).length;
    const mastered=cards.filter(c=>(c.mastery||0)>=5).length;
    const totSec=sess.reduce((n,x)=>n+(x.dur||0),0), rev=sess.reduce((n,x)=>n+(x.reviewed||0),0), corr=sess.reduce((n,x)=>n+(x.correct||0),0);
    rows.push({name:d.name,streak:d.streak||0,learned:cards.length,mastered,weak,sessions:sess.length,time:totSec,acc:rev?Math.round(corr/rev*100):0,_sess:sess}); }
  const avgAcc=rows.length?Math.round(rows.reduce((n,r)=>n+r.acc,0)/rows.length):0;
  let html=`<div class="grid cols3"><div class="stat"><b>${rows.length}</b><span>HỌC VIÊN</span></div><div class="stat"><b>${avgAcc}%</b><span>ĐÚNG TB</span></div><div class="stat"><b>${rows.reduce((n,r)=>n+r.mastered,0)}</b><span>TỪ THUỘC</span></div></div>
    <div class="row" style="margin:14px 0"><button class="btn sm" id="csv">⬇️ Xuất CSV để phân tích</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Tên</th><th>🔥</th><th>Đã học</th><th>Thuộc</th><th>Từ yếu</th><th>Buổi</th><th>T.gian</th><th>Đúng</th></tr></thead><tbody>`;
  rows.forEach(r=>html+=`<tr><td>${esc(r.name)}</td><td>${r.streak}</td><td>${r.learned}</td><td>${r.mastered}</td><td class="${r.weak?'weak':''}">${r.weak}</td><td>${r.sessions}</td><td>${fmtDur(r.time)}</td><td>${r.acc}%</td></tr>`);
  html+='</tbody></table></div>'; panel.innerHTML=html;
  $('#csv').onclick=()=>exportCSV(rows);
}
function exportCSV(rows){
  let lines=[['Tên','Chuỗi','Đã học','Thuộc','Từ yếu','Số buổi','Tổng giây','% đúng'].join(',')];
  rows.forEach(r=>lines.push([r.name,r.streak,r.learned,r.mastered,r.weak,r.sessions,r.time,r.acc].join(',')));
  lines.push(''); lines.push(['Tên','Tuần','Ngày','Kiểu','Số từ','Đúng','Sai','Giây'].join(','));
  rows.forEach(r=>r._sess.forEach(s=>lines.push([r.name,s.week||'',new Date(s.startedAt).toISOString().slice(0,10),s.game||'',s.reviewed||0,s.correct||0,s.wrong||0,s.dur||0].join(','))));
  const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='xiaoyu_'+(STATE.codeShort||'lop')+'_'+todayKey()+'.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function teacherContent(){
  const panel=$('#panel');
  let html=`<p class="muted">Nội dung 6 bài (${TOTAL_WORDS} từ) đã nạp sẵn trong hệ thống. Học viên học & ôn theo đây.</p>`;
  LESSONS.forEach(l=>{
    html+=`<div class="soft" style="padding:14px;margin-top:12px"><div class="spread"><b>${esc(l.title)}</b><span class="pill">${l.words.length} từ</span></div>
      <div class="tbl-wrap" style="margin-top:8px"><table><tbody>`;
    l.words.forEach(w=>html+=`<tr><td style="font-family:'Baloo 2'">${esc(w.hanzi)}</td><td>${esc(w.pinyin)}</td><td class="muted">${esc(w.pos)}</td><td>${esc(w.vi)}</td></tr>`);
    html+=`</tbody></table></div></div>`;
  });
  panel.innerHTML=html;
}

viewLanding();
